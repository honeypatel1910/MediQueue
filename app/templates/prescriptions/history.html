{% extends "base.html" %}

{% block title %}Prescription History | MediQueue{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div>
        <p class="text-uppercase text-primary fw-semibold small mb-2">Prescription History</p>
        <h1 class="h3 fw-bold mb-1">Your prescription requests</h1>
        <p class="text-muted mb-0">Track requests submitted to the GP practice.</p>
    </div>
    <a class="btn btn-primary" href="{{ url_for('prescriptions.request_prescription') }}">New Prescription Request</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        {% include "partials/prescriptions_table.html" %}
    </div>
</div>
{% endblock %}
