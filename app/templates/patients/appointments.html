{% extends "base.html" %}

{% block title %}My Appointments | MediQueue{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div>
        <p class="text-uppercase text-primary fw-semibold small mb-2">My Appointments</p>
        <h1 class="h3 fw-bold mb-1">Appointment history</h1>
        <p class="text-muted mb-0">View booked, cancelled, completed and missed GP appointments.</p>
    </div>
    <a class="btn btn-primary" href="{{ url_for('appointments.available_slots') }}">Book Appointment</a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        {% include "partials/appointments_table.html" %}
    </div>
</div>
{% endblock %}
